<style>
/* Layout: big hero → facilitator pair → member card grid (3 cols PC / 1 col phone) → card opens a full story sheet. Tab switches to "100일 목표" wall. */
:root {
  --bg: #F3F5EF;
  --surface: #FFFFFF;
  --fg: #1C2621;
  --muted: #5D6B63;
  --line: #DCE2D8;
  --accent: #C9761E;
  --accent-soft: #F7E7CF;
  --ink: #2F5A47;
  --a1-bg:#F6E1D3; --a1-fg:#8A3E14;
  --a2-bg:#DCEBDF; --a2-fg:#2C5C3E;
  --a3-bg:#DEE5F3; --a3-fg:#2F4A82;
  --a4-bg:#F3E0EA; --a4-fg:#83305B;
  --a5-bg:#F2EBCB; --a5-fg:#6E5A10;
  --a6-bg:#E3E0F2; --a6-fg:#4A3C8C;
  --shadow: 0 1px 2px rgba(28,38,33,.05), 0 8px 24px rgba(28,38,33,.06);
  --f-display: "Paperlogy", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 17px; line-height: 1.7;
  word-break: keep-all; overflow-wrap: anywhere;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 80px;
}
.wrap { max-width: 1240px; margin: 0 auto; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

/* hero */
.hero { padding-block: clamp(48px, 8vw, 104px) clamp(28px, 4vw, 48px); display: grid; gap: 20px; }
.eyebrow { font-size: 15px; font-weight: 600; letter-spacing: .08em; color: var(--ink); }
.hero h1 {
  font-family: var(--f-display); font-weight: 800; margin: 0;
  font-size: clamp(44px, 8vw, 104px); line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance;
}
.hero h1 .num { color: var(--accent); }
.hero p { margin: 0; max-width: 40ch; font-size: clamp(18px, 2vw, 22px); color: var(--muted); line-height: 1.6; text-wrap: pretty; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 15px; color: var(--muted); }
.stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

/* tabs */
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 12px; margin-bottom: 8px;
  display: flex; gap: 8px; border-bottom: 1px solid var(--line);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tab {
  font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
  padding: 10px 20px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--muted);
}
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* sections */
.group { display: grid; gap: 20px; padding-block: 36px 8px; }
.group-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.group-head h2 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 3vw, 34px); margin: 0; }
.group-head span { color: var(--muted); font-size: 15px; }

.grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
.grid.facil { grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); }

/* card */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 28px; display: flex; flex-direction: column; gap: 18px; min-width: 0;
  cursor: pointer; transition: transform .18s ease, box-shadow .18s ease;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.who { display: flex; align-items: center; gap: 16px; min-width: 0; }
.avatar {
  flex: none; width: 64px; height: 64px; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -0.02em;
}
.facil .avatar { width: 76px; height: 76px; font-size: 26px; }
.who-text { min-width: 0; }
.name { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.2; margin: 0; }
.brand { color: var(--muted); font-size: 15px; font-weight: 500; }
.role-badge { display: inline-block; font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; margin-left: 6px; vertical-align: 3px; font-family: var(--f-body); }
.work { margin: 0; font-size: 16px; color: var(--muted); line-height: 1.55; }
.line {
  margin: 0; font-family: var(--f-display); font-weight: 700;
  font-size: clamp(21px, 2vw, 24px); line-height: 1.45; text-wrap: balance; flex: 1;
}
.facil .line { font-size: clamp(22px, 2.3vw, 27px); }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sns { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip {
  font-size: 14px; text-decoration: none; padding: 4px 12px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); background: var(--bg);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip:hover { color: var(--fg); border-color: var(--muted); }
.open {
  font: inherit; font-size: 15px; font-weight: 600; color: var(--ink);
  background: none; border: 0; padding: 4px 0; cursor: pointer; white-space: nowrap;
}
.card:hover .open { text-decoration: underline; text-underline-offset: 4px; }

.card.waiting { cursor: default; background: transparent; border-style: dashed; justify-content: center; }
.card.waiting:hover { transform: none; box-shadow: none; }
.card.waiting .avatar { background: var(--line); color: var(--muted); }
.card.waiting .line { color: var(--muted); font-size: 19px; flex: none; }

/* goals wall */
.goals { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); padding-block: 36px 0; }
.goal {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 28px; display: grid; gap: 14px; align-content: start; min-width: 0;
}
.goal .who .avatar { width: 48px; height: 48px; font-size: 17px; }
.goal .name { font-size: 22px; }
.goal-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: g; }
.goal-list li {
  counter-increment: g; display: grid; grid-template-columns: 36px 1fr; gap: 14px; align-items: baseline;
  font-family: var(--f-display); font-weight: 500; font-size: clamp(19px, 1.8vw, 21px); line-height: 1.45;
  padding-bottom: 12px; border-bottom: 1px solid var(--line);
}
.goal-list li:last-child { border-bottom: 0; padding-bottom: 0; }
.goal-list li::before {
  content: counter(g); font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1;
  color: var(--accent); font-variant-numeric: tabular-nums;
}
.goal .more { justify-self: start; }

/* sheet */
dialog.sheet {
  width: min(820px, 100%); max-height: min(92vh, 100%); margin: auto;
  border: 0; border-radius: 24px; padding: 0; background: var(--surface); color: var(--fg);
  box-shadow: 0 30px 80px rgba(0,0,0,.35);
}
dialog.sheet::backdrop { background: rgba(14,20,17,.55); backdrop-filter: blur(3px); }
.sheet-inner { display: grid; gap: 28px; padding: clamp(24px, 5vw, 56px); }
.sheet-top { display: flex; gap: 20px; align-items: center; }
.sheet-top .avatar { width: 88px; height: 88px; font-size: 30px; }
.sheet-top .name { font-size: clamp(30px, 4vw, 40px); }
.sheet .line { font-size: clamp(22px, 3vw, 28px); padding: 20px 24px; background: var(--accent-soft); border-radius: 16px; flex: none; }
.sec { display: grid; gap: 10px; }
.sec h3 {
  margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .06em; color: var(--ink);
  display: flex; align-items: center; gap: 10px;
}
.sec h3 .n {
  display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
  background: var(--ink); color: var(--surface); font-size: 13px; letter-spacing: 0;
}
.sec .body { font-size: clamp(17px, 1.6vw, 19px); line-height: 1.85; max-width: 62ch; }
.sec .body p { margin: 0 0 1em; }
.sec .body p:last-child { margin: 0; }
.sec.extra { border-top: 1px solid var(--line); padding-top: 28px; }
.sheet-close {
  position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end;
  padding: 14px 14px 0; margin-bottom: -58px; pointer-events: none;
}
.icon-btn {

    goal:`이번 100일의 목표는 팬을 만들고, 팔로워 1만 명에 도전하며, 저만의 콘텐츠를 차곡차곡 쌓아가는 것!

    story:`디자인 일을 오래 해왔지만, 무인카페를 약 2년간 직접 운영하면서 사장님의 입장에서도 참 많은 걸 배우고 경험했어요.

    goal:`이번 100일의 가장 큰 목표는 디자인돕다 계정을 성장시키면서 제 고객이 될 사장님들을 더 많이 만나는 것!

    story:`원래 20년 동안 베이비 스튜디오를 운영하다가, 예기치 못한 외부 사정으로 하루아침에 가게를 정리하게 되었습니다. 수중에 큰돈이 없어 7,000만 원으로 8년 전 지금의 흑염소 식당을 시작했어요.
코로나 시기 매출이 꺾이면서 돌파구로 밀키트를 만들었고, 이걸 알리려고 인스타그램도 시작했습니다. 감사하게도 인친분들이 드셔 보시고 공구 제안을 주신 적도 있지만, 아직 채널을 통해 큰 성과를 내지는 못한 상태입니다.`,
    why:`이제는 가게나 메뉴만이 아니라 '청춘흑염소를 운영하는 나'를 제대로 브랜딩하고 싶습니다.
50대에 은퇴하신 분들이 막연히 치킨집부터 고민하시는 대신, 부부가 함께 운영해도 알짜배기로 꾸릴 수 있는 흑염소 전수창업의 길도 나누고, 무엇보다 이 건강한 음식을 더 많은 분들이 드실 수 있게 알리고 싶어요.`,
    goal:`현재 인스타 팔로워가 약 4,700명인데, 아직은 확실한 방향성을 잡지 못했습니다.
앞으로 100일 동안 저만의 인스타 방향성을 제대로 잡고 꾸준히 밀고 나가서 만팔(1만 팔로워)을 달성하는 게 목표입니다. 신랑 반대를 무릅쓰고 신청한 만큼, 그 마음까지 원동력 삼아 정말 열심히 해보겠습니다!`
  }
},
];

/* 100일 목표: 원문을 짧게 정리한 버전 (원문은 카드를 펼치면 그대로 있어요) */
const GOALS = {
  eunhee:   ["팬 만들기", "팔로워 1만 명 도전", "‘사람 최은희’ 계정으로 나에게 맞는 콘텐츠 찾기"],
  eunkyung: ["새 주문·결제 시스템 만들기", "송장 정리부터 업무 자동화까지 구축하기", "반복 업무를 줄이고 고객과 소통하는 시간 늘리기"],
  darae:    ["디자인돕다 계정 키우기, 팔로워 1만 명 도전", "고객이 될 사장님들 더 많이 만나기", "사업의 큰 그림과 고객을 만나는 길목 설계하기"],
  youngjin: ["AI로 인스타·블로그 계정 키우기", "내 계정의 방향과 색깔 찾기", "콘텐츠로 돈이 벌리는 경험 해보기"],
  eunji:    ["서툴러도 매일 기록하기", "‘5븐’의 두 번째 챕터를 온라인에 자리 잡기", "100일 끝까지 완주하기"],
  mina:     ["오리지널 코드, 나의 색깔 찾기", "내가 나아갈 방향 찾기", "조원들과 경험을 나누며 함께 성장하기"],
  sunyoung: ["콘텐츠와 AI를 기초부터 익히기", "인스타와 친해지기", "느려도 끝까지 함께 달리기"],
  jooyoung: ["나의 오리지널 코드 발견하기", "콘텐츠로 빵집 제대로 알리기", "100일 뒤 팔로워 1만 명"],
  hyesook:  ["수업과 과제 밀리지 않기", "콘텐츠와 AI 제대로 익히기", "좋은 분들과 많이 배우기"],
  eunjin:   ["인스타 릴스 꾸준히 만들기", "블로그 하루 방문자 100명 넘기", "35조와 의미 있는 100일 만들기"],
  kyungok:  ["배운 것을 실행으로 옮기기", "커뮤니티에 ‘3일 1노력’으로 참여하기", "판매 전환을 끌어올려 “저 매출 있어요!” 말하기"],
  anna:     ["포기하지 않고 완주하기", "도망가지 않고 잘 참여하기", "인스타와 친해지고 꽃집의 정체성 찾기"],
  bora:     ["콘텐츠를 꾸준히 기획·발행하는 습관 만들기", "반응 좋은 콘텐츠를 읽는 안목 키우기", "신뢰받는 F&B 인플루언서로 성장하기"],
  seunghyun: ["내가 정말 잘할 수 있는 일 찾기", "전과는 다른 나 발견하기", "돈 걱정 없는 삶을 향한 첫걸음 떼기"],
  minji:    ["하루에 작은 목표 1가지씩 성공하기", "해내는 힘을 습관으로 만들기", "마지막 날 웃으며 100일 마무리하기"],
  sangyun:  ["나만의 인스타 방향성 잡기", "정한 방향으로 꾸준히 밀고 나가기", "팔로워 4,700명에서 1만 명으로"],
  hyunjung: ["100일 완주하기", "‘범표원두 김현정’과 ‘사람 김현정’의 오리지널 코드 세우기", "상상하지 못한 나를 발견하기"],
};

const SEC = [
  ["intro","나의 소개"],
  ["story","나의 이야기"],
  ["storywhy","나의 이야기 · 프클 3기 참여 이유"],
  ["why","프클 3기 참여 이유"],
  ["goal","프클 3기 목표"],
];

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const paras = t => t.trim().split(/\n\s*\n/).map(p => "<p>" + esc(p).replace(/\n/g,"<br>") + "</p>").join("");
const avatar = p => `<div class="avatar" aria-hidden="true" style="${p.waiting ? "" : `background:var(--a${p.c}-bg);color:var(--a${p.c}-fg)`}">${esc(p.short)}</div>`;
const chips = p => (p.sns||[]).map(x => `<a class="chip" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join("");

// 퍼실 먼저, 조원은 이름 가나다순
PEOPLE.sort((a, b) => (b.facil ? 1 : 0) - (a.facil ? 1 : 0) || (a.facil ? 0 : a.name.localeCompare(b.name, "ko")));
const ready = PEOPLE.filter(p => !p.waiting);

function card(p) {
  if (p.waiting) return `
    <article class="card waiting">
      <div class="who">${avatar(p)}<div class="who-text"><h3 class="name">${esc(p.name)}</h3><div class="brand">${esc(p.brand)}</div></div></div>
      ${p.work ? `<p class="work">${esc(p.work)}</p>` : ""}
      <p class="line">소개 글을 기다리고 있어요</p>
      ${p.sns && p.sns.length ? `<div class="sns">${chips(p)}</div>` : ""}
    </article>`;
  return `
    <article class="card" data-id="${p.id}">
      <div class="who">${avatar(p)}<div class="who-text">
        <h3 class="name">${esc(p.name)}${p.facil ? '<span class="role-badge">퍼실</span>' : ""}</h3>
        <div class="brand">${esc(p.brand)}</div></div></div>
      <p class="work">${esc(p.work)}</p>
      <p class="line">${esc(p.line)}</p>
      <div class="card-foot">
        <div class="sns">${chips(p)}</div>
        <button class="open" data-open="${p.id}" aria-label="${esc(p.name)}님 이야기 전체 보기">이야기 읽기 →</button>
      </div>
    </article>`;
}

document.getElementById("facil").innerHTML = PEOPLE.filter(p => p.facil).map(card).join("");
document.getElementById("members").innerHTML = PEOPLE.filter(p => !p.facil).map(card).join("");
const waitingN = PEOPLE.length - ready.length;
document.getElementById("stats").innerHTML =
  `<span>함께하는 사람 <b>${PEOPLE.length}명</b></span><span>도착한 소개 <b>${ready.length}편</b></span>` +
  (waitingN ? `<span>기다리는 소개 <b>${waitingN}편</b></span>` : "");

document.getElementById("goals").innerHTML = ready.map(p => `
  <article class="goal">
    <div class="who">${avatar(p)}<div class="who-text"><h3 class="name">${esc(p.name)}</h3><div class="brand">${esc(p.brand)}</div></div></div>
    <ol class="goal-list">${(GOALS[p.id] || []).map(g => `<li>${esc(g)}</li>`).join("")}</ol>
    <button class="open more" data-open="${p.id}">${esc(p.name)}님 이야기 전체 보기 →</button>
  </article>`).join("");

/* sheet */
const sheet = document.getElementById("sheet");
const body = document.getElementById("sheet-body");
let current = -1;

function openSheet(id) {
  const i = ready.findIndex(p => p.id === id);
  if (i < 0) return;
  current = i;
  const p = ready[i];
  let n = 0;
  const secs = SEC.filter(([k]) => p.s[k]).map(([k, label]) => `
    <section class="sec"><h3><span class="n">${++n}</span>${label}</h3><div class="body">${paras(p.s[k])}</div></section>`).join("");
  const pre = p.s.pre ? `<div class="sec"><div class="body">${paras(p.s.pre)}</div></div>` : "";
  const post = p.s.post ? `<div class="sec"><div class="body">${paras(p.s.post)}</div></div>` : "";
  const extra = p.s.extra ? `<section class="sec extra"><h3>지원하며 쓴 글</h3><div class="body">${paras(p.s.extra)}</div></section>` : "";
  const prev = ready[i-1], next = ready[i+1];
  body.innerHTML = `
    <div class="sheet-top">${avatar(p)}<div class="who-text">
      <h2 class="name" id="sheet-name">${esc(p.name)}${p.facil ? '<span class="role-badge">퍼실</span>' : ""}</h2>
      <div class="brand">${esc(p.brand)}</div></div></div>
    <p class="work">${esc(p.work)}</p>
    ${p.sns && p.sns.length ? `<div class="sns">${chips(p)}</div>` : ""}
    <p class="line">${esc(p.line)}</p>
    ${pre}${secs}${post}${extra}
    <div class="sheet-nav">
      <button data-open="${prev ? prev.id : ""}" ${prev ? "" : "hidden"}><small>← 이전</small>${prev ? esc(prev.name) : ""}</button>
      <button data-open="${next ? next.id : ""}" ${next ? "" : "hidden"}><small>다음 →</small>${next ? esc(next.name) : ""}</button>
    </div>`;
  if (!sheet.open) sheet.showModal();
  sheet.scrollTop = 0;
  body.scrollTop = 0;
}

document.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const btn = e.target.closest("[data-open]");
  if (btn && btn.dataset.open) { openSheet(btn.dataset.open); return; }
  const c = e.target.closest(".card[data-id]");
  if (c) openSheet(c.dataset.id);
});
document.getElementById("sheet-x").addEventListener("click", () => sheet.close());
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });
document.addEventListener("keydown", e => {
  if (!sheet.open) return;
  if (e.key === "ArrowRight" && ready[current+1]) openSheet(ready[current+1].id);
  if (e.key === "ArrowLeft" && ready[current-1]) openSheet(ready[current-1].id);
});

/* tabs */
const tabs = { people: document.getElementById("tab-people"), goals: document.getElementById("tab-goals") };
function show(view) {
  const g = view === "goals";
  tabs.people.setAttribute("aria-selected", String(!g));
  tabs.goals.setAttribute("aria-selected", String(g));
  document.getElementById("view-people").hidden = g;
  document.getElementById("view-goals").hidden = !g;
}
tabs.people.addEventListener("click", () => { history.replaceState(null, "", "#people"); show("people"); });
tabs.goals.addEventListener("click", () => { history.replaceState(null, "", "#goals"); show("goals"); });
const route = () => show(location.hash === "#goals" ? "goals" : "people");
window.addEventListener("hashchange", route);
route();
</script>

</html>
