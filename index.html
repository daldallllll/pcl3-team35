<style>
/* Layout: big hero → facilitator pair → member card grid (3 cols PC / 1 col phone) → card opens a full story sheet. Tab switches to "100일 목표" wall. */
:root {
  --bg: #F3F5EF;
  --surface: #FFFFFF;
  --fg: #1C2621;
  --muted: #5D6B63;
  --line: #DCE2D8;
  --accent: #C9761E;
  --accent-soft: #F7E7CF;
  --ink: #2F5A47;
  --a1-bg:#F6E1D3; --a1-fg:#8A3E14;
  --a2-bg:#DCEBDF; --a2-fg:#2C5C3E;
  --a3-bg:#DEE5F3; --a3-fg:#2F4A82;
  --a4-bg:#F3E0EA; --a4-fg:#83305B;
  --a5-bg:#F2EBCB; --a5-fg:#6E5A10;
  --a6-bg:#E3E0F2; --a6-fg:#4A3C8C;
  --shadow: 0 1px 2px rgba(28,38,33,.05), 0 8px 24px rgba(28,38,33,.06);
  --f-display: "Paperlogy", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 17px; line-height: 1.7;
  word-break: keep-all; overflow-wrap: anywhere;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 80px;
}
.wrap { max-width: 1240px; margin: 0 auto; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

/* hero */
.hero { padding-block: clamp(48px, 8vw, 104px) clamp(28px, 4vw, 48px); display: grid; gap: 20px; }
.eyebrow { font-size: 15px; font-weight: 600; letter-spacing: .08em; color: var(--ink); }
.hero h1 {
  font-family: var(--f-display); font-weight: 800; margin: 0;
  font-size: clamp(44px, 8vw, 104px); line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance;
}
.hero h1 .num { color: var(--accent); }
.hero p { margin: 0; max-width: 40ch; font-size: clamp(18px, 2vw, 22px); color: var(--muted); line-height: 1.6; text-wrap: pretty; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 15px; color: var(--muted); }
.stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

/* tabs */
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 12px; margin-bottom: 8px;
  display: flex; gap: 8px; border-bottom: 1px solid var(--line);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tab {
  font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
  padding: 10px 20px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--muted);
}
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* sections */
.group { display: grid; gap: 20px; padding-block: 36px 8px; }
.group-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.group-head h2 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 3vw, 34px); margin: 0; }
.group-head span { color: var(--muted); font-size: 15px; }

.grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
.grid.facil { grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); }

/* card */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 28px; display: flex; flex-direction: column; gap: 18px; min-width: 0;
  cursor: pointer; transition: transform .18s ease, box-shadow .18s ease;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.who { display: flex; align-items: center; gap: 16px; min-width: 0; }
.avatar {
  flex: none; width: 64px; height: 64px; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -0.02em;
}
.facil .avatar { width: 76px; height: 76px; font-size: 26px; }
.who-text { min-width: 0; }
.name { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.2; margin: 0; }
.brand { color: var(--muted); font-size: 15px; font-weight: 500; }
.line .seg { display: inline; }
@media (min-width: 601px) { .line .seg { display: block; } }
.handle { margin-top: 3px; font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sicons { margin-left: auto; align-self: flex-start; display: flex; gap: 6px; flex: none; }
.sicon {
  width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  transition: background .15s, color .15s, border-color .15s;
}
.sicon svg { width: 19px; height: 19px; }
.card, .goal { position: relative; }
.card .sicons.at-top, .goal .sicons.at-top { position: absolute; top: 22px; right: 22px; }
.card:has(.sicons.at-top) .name, .goal:has(.sicons.at-top) .name { padding-right: 84px; }
.card:has(.sicons.at-top .sicon:nth-child(3)) .name, .goal:has(.sicons.at-top .sicon:nth-child(3)) .name { padding-right: 126px; }

.sicon:hover, .sicon:focus-visible { color: #fff; border-color: transparent; }
.sicon.ig:hover, .sicon.ig:focus-visible { background: #D6336C; }
.sicon.blog:hover, .sicon.blog:focus-visible { background: #03A94D; }
.sicon.th:hover, .sicon.th:focus-visible { background: #111; }
.accts { display: flex; flex-wrap: wrap; gap: 10px; }
.acct {
  display: flex; align-items: center; gap: 12px; min-width: 0; max-width: 100%;
  padding: 10px 16px 10px 10px; border-radius: 14px; text-decoration: none;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  transition: border-color .15s, transform .15s;
}
.acct:hover { border-color: var(--muted); transform: translateY(-1px); }
.acct-ic { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 11px; color: #fff; }
.acct-ic svg { width: 22px; height: 22px; }
.acct.ig .acct-ic { background: #D6336C; }
.acct.blog .acct-ic { background: #03A94D; }
.acct.th .acct-ic { background: #111; }
.acct-t { display: grid; min-width: 0; font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.acct-t small { font-size: 12.5px; font-weight: 500; color: var(--muted); }
.acct-go { color: var(--muted); margin-left: auto; padding-left: 6px; }
.acct-none { color: var(--muted); font-size: 15px; padding: 10px 0; }
.links-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-block: 36px 20px; }
.links-head h2 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 3vw, 34px); margin: 0; }
.links-head span { color: var(--muted); font-size: 15px; }
.links { display: grid; gap: 14px; }
.link-row {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px 26px;
  display: grid; grid-template-columns: minmax(240px, 340px) 1fr; gap: 16px 28px; align-items: center;
}
.link-row .avatar { width: 52px; height: 52px; font-size: 18px; }
.link-row .name { font-size: 22px; }
@media (max-width: 760px) { .link-row { grid-template-columns: 1fr; padding: 20px; } .acct { flex: 1 1 100%; } }
.brand b { color: var(--ink); font-weight: 600; }
.brand .dot { margin: 0 6px; opacity: .6; }
.role-badge { display: inline-block; font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; margin-left: 6px; vertical-align: 3px; font-family: var(--f-body); }
.work { margin: 0; font-size: 16px; color: var(--muted); line-height: 1.55; }
.line {
  margin: 0; font-family: var(--f-display); font-weight: 700;
  font-size: clamp(21px, 2vw, 24px); line-height: 1.45; text-wrap: balance; flex: 1;
}
.facil .line { font-size: clamp(22px, 2.3vw, 27px); }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sns { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip {
  font-size: 14px; text-decoration: none; padding: 4px 12px; border-radius: 999px;

{
  id:"eunhee", job:"디저트 카페", facil:true, name:"최은희", short:"은희", brand:"최니사장 · 비넨토", c:1,
  work:"디저트 카페 '비넨토' 운영 · 1·2기에 이어 3기 퍼실리테이터",
  line:"판매자 계정 말고,|‘사람 최은희’의 이야기를 시작해요",
  sns:[ig("choini_sajang")],
  s:{
    intro:`저는 1기와 2기 프리미엄 클래스 퍼실리테이터로 함께했습니다. 현재는 '비넨토'라는 디저트 카페를 운영하고 있습니다.`,
    story:`1·2기 당시에는 '꽃빙'이라는 디저트 카페를 운영하고 있었습니다.

꽃빙 계정에서는 답례품, 시즌 케이크, 온라인 판매부터 로컬 기반의 재미있는 썰 릴스까지 다양한 콘텐츠로 많은 분들의 사랑을 받았어요.

배운 오리지널 코드와 콘텐츠 전략을 실제 브랜드에 녹여내고, 매출로 연결하기 위해 열심히 실행했던 시간이었습니다. 아마 카페에서 '최은희'를 검색하시면 그때의 흔적을 많이 찾아보실 수 있을 거예요! 😁

    why:`이번 3기에서는 또 다른 도전을 해보려고 해요.

브랜드 계정은 브랜드 계정대로 성장시키고, 제 개인 계정은 '사람 최은희'의 이야기를 담는 공간으로 만들어 보려고 합니다.

특히 출산을 앞둔 지금, 저와 비슷한 고민을 하는 초보 사장님들에게 제 경험과 시행착오가 작은 도움이 되었으면 하는 마음도 있어요.`,
    goal:`이번 100일의 목표는 팬을 만들고, 팔로워 1만 명에 도전하며, 저만의 콘텐츠를 차곡차곡 쌓아가는 것!

판매자이자 마케터로 운영했던 계정과 사람 최은희로 운영하는 계정은 분명 다를 거라고 생각해요.

다양한 시도와 테스트를 통해 저에게 가장 잘 맞는 옷을 찾아가는 100일!

35조 여러분과 함께 즐겁게, 치열하게 성장해 보겠습니다. 잘 부탁드립니다! ❤️`

{
  id:"eunkyung", job:"복숭아 농가", facil:true, name:"신은경", short:"은경", brand:"피치랩 · 복자네 복숭아", c:4,
  work:"경북 김천 복숭아 농가의 '피치랩' 대표 · 제철 농산물 판매 10년 차",
  line:"내가 덜 바빠도|잘 돌아가는 복숭아 가게 만들기",
  sns:[ig("_peach_lab")],
  s:{
    intro:`안녕하세요^^ 매년 여름 복숭아를 소개하고 있는 피치랩 신은경입니다🍑

경북 김천에서 남편과 시부모님이 복숭아 농사를 짓고 계시고, 저희 농장의 복숭아는 '복자네 복숭아'라는 이름으로 소개하고 있어요.

피치랩에서는 여름마다 50여 종의 복숭아를 소개하고, 다른 계절에는 사과, 샤인머스캣, 멜론, 고춧가루, 생강 등 다양한 제철 농산물을 판매하고 있습니다.

매출이 여름에 집중되어 있어 사계절 판매할 수 있는 새로운 상품도 꾸준히 발굴하고 있어요.

    story:`원래는 고등학교에서 학생들을 가르치던 교사였어요. 사랑하는 학생들과 학교에서의 꿈을 접어두고, 남편의 갑작스러운 귀농을 계기로 피치랩을 시작하게 되었습니다.

'복켓팅', '복수저' 같은 재미있는 신조어까지 만들어 주시고, 해마다 찾아주시는 손님분들 덕분에 벌써 10년째 복숭아와 여름을 보내고 있어요🍑

하는 일은 달라졌지만, 누군가에게 도움이 되고 싶은 마음은 여전히 같습니다.`,
    why:`프클 1기와 2기를 모두 수강했고, 이번 3기에는 퍼실리테이터로 함께하게 되었습니다.

    goal:`이번 100일의 목표는 '제가 조금 덜 바빠도 잘 돌아가는 시스템 만들기'입니다!!!

퍼실로서도 조원분들과 서로 배우고 응원하며, 함께 성장하는 100일을 만들어 가고 싶습니다. 앞으로 잘 부탁드립니다! 🫶🏻💛`

  work:"16년 차 디자이너 · 사장님들이 스스로 해낼 수 있게 돕는 '디자인돕다' 운영",

  sns:[ig("design.dopda"), ig("midgo.jeonju"), blog("darvv")],
  s:{
    intro:`안녕하세요! 프클 3기 여러분 🧡 전주에서 세 아이를 키우며 사장님들을 돕는 일을 하고 있는 배다래입니다. 반갑습니다! 😍

    story:`디자인 일을 오래 해왔지만, 무인카페를 약 2년간 직접 운영하면서 사장님의 입장에서도 참 많은 걸 배우고 경험했어요.

    why:`프클 2기를 수강했는데요! 제 강점과 방향을 찾는 것, 콘텐츠에서도 크게 배웠어요! 이번 3기에서는 더 뾰족하게 칼을 갈아ㅎㅎ 사장님들에게 도움이 되는 것들을 제가 먼저 흡수하고 아주 쉽게 알려드리는 통로가 되고 싶어서 수강하게 되었어요!

물건뿐 아니라 아이들의 학교, 일상의 크고 작은 선택까지 제가 중요하게 생각하는 가치와 선택의 이유를 나누고 싶어요.

const SEC = [
  ["intro","나의 소개"],
  ["story","나의 이야기"],
  ["storywhy","나의 이야기 · 프클 3기 참여 이유"],
  ["why","프클 3기 참여 이유"],
  ["goal","프클 3기 목표"],
];

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const paras = t => t.trim().split(/\n\s*\n/).map(p => "<p>" + esc(p).replace(/\n/g,"<br>") + "</p>").join("");
const avatar = p => `<div class="avatar" aria-hidden="true" style="${p.waiting ? "" : `background:var(--a${p.c}-bg);color:var(--a${p.c}-fg)`}">${esc(p.short)}</div>`;
const lineHTML = t => String(t).split("|").map(x => `<span class="seg">${esc(x.trim())}</span>`).join(" ");
const sub = p => `<div class="brand">${p.job ? `<span class="job">${esc(p.job)}</span><span class="dot">·</span>` : ""}<b>${esc(p.brand)}</b></div>`;
const SNS_NAME = { ig: "인스타그램", blog: "블로그", th: "스레드" };
const ICON = {
  ig: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.4" cy="6.6" r="1.3" fill="currentColor"/></svg>',
  blog: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 7.5h4.2a2.3 2.3 0 0 1 0 4.6H8.5zM8.5 12.1h4.8a2.2 2.2 0 0 1 0 4.4H8.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>',
  th: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.7 11.2c-.3-2.4-1.9-3.7-4.4-3.7-2 0-3.4.9-4 2.4m8.4 1.3c-1-.3-2.1-.4-3.2-.3-2.3.1-3.6 1.2-3.5 2.7.1 1.4 1.5 2.3 3.2 2.2 2.4-.1 3.6-1.8 3.5-5.9m0 0c2 .9 3 2.6 2.6 4.6-.6 2.8-3.2 4.5-6.6 4.5-4.4 0-7.2-3-7.2-8.1S7.9 3.7 12.3 3.7c3.4 0 5.7 1.6 6.6 4.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>'
};
const acctText = x => x.type === "blog" ? "블로그 · " + x.label : x.label;
const icons = (p, pos = "top") => (p.sns && p.sns.length) ? `<div class="sicons at-${pos}">${p.sns.map(x =>
  `<a class="sicon ${x.type}" href="${esc(x.url)}" target="_blank" rel="noopener" aria-label="${SNS_NAME[x.type]} ${esc(acctText(x))}" title="${SNS_NAME[x.type]} ${esc(acctText(x))}">${ICON[x.type]}</a>`).join("")}</div>` : "";
const handle = p => (p.sns && p.sns.length) ? `<div class="handle">${esc(acctText(p.sns[0]))}</div>` : "";
const acctBtns = p => (p.sns || []).map(x =>
  `<a class="acct ${x.type}" href="${esc(x.url)}" target="_blank" rel="noopener"><span class="acct-ic">${ICON[x.type]}</span><span class="acct-t"><small>${SNS_NAME[x.type]}</small>${esc(x.type === "blog" ? x.label : x.label)}</span><span class="acct-go" aria-hidden="true">↗</span></a>`).join("");
const chips = p => (p.sns||[]).map(x => `<a class="chip" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join("");

// 퍼실 먼저, 조원은 이름 가나다순
PEOPLE.sort((a, b) => (b.facil ? 1 : 0) - (a.facil ? 1 : 0) || (a.facil ? 0 : a.name.localeCompare(b.name, "ko")));
const ready = PEOPLE.filter(p => !p.waiting);

function card(p) {
  if (p.waiting) return `
    <article class="card waiting">
      <div class="who">${avatar(p)}<div class="who-text"><h3 class="name">${esc(p.name)}</h3>${sub(p)}</div></div>
      ${p.work ? `<p class="work">${esc(p.work)}</p>` : ""}
      <p class="line">소개 글을 기다리고 있어요</p>
      ${p.sns && p.sns.length ? `<div class="sns">${chips(p)}</div>` : ""}
    </article>`;
  return `
    <article class="card" data-id="${p.id}">
      <div class="who">${avatar(p)}<div class="who-text">
        <h3 class="name">${esc(p.name)}${p.facil ? '<span class="role-badge">퍼실</span>' : ""}</h3>
        ${sub(p)}${handle(p)}</div>${icons(p)}</div>
      <p class="work">${esc(p.work)}</p>
      <p class="line">${lineHTML(p.line)}</p>
      <div class="card-foot">
        <button class="open" data-open="${p.id}" aria-label="${esc(p.name)}님 이야기 전체 보기">이야기 읽기 →</button>
        ${icons(p, "foot")}
      </div>
    </article>`;
}

document.getElementById("facil").innerHTML = PEOPLE.filter(p => p.facil).map(card).join("");
document.getElementById("members").innerHTML = PEOPLE.filter(p => !p.facil).map(card).join("");
const waitingN = PEOPLE.length - ready.length;
document.getElementById("stats").innerHTML =
  `<span>함께하는 사람 <b>${PEOPLE.length}명</b></span><span>도착한 소개 <b>${ready.length}편</b></span>` +
  (waitingN ? `<span>기다리는 소개 <b>${waitingN}편</b></span>` : "");

document.getElementById("goals").innerHTML = ready.map(p => `
  <article class="goal">
    <div class="who">${avatar(p)}<div class="who-text"><h3 class="name">${esc(p.name)}</h3>${sub(p)}${handle(p)}</div>${icons(p)}</div>
    <ol class="goal-list">${(GOALS[p.id] || []).map(g => `<li>${esc(g)}</li>`).join("")}</ol>
    <div class="card-foot"><button class="open more" data-open="${p.id}"><span class="nm">${esc(p.name)}님 </span>이야기 전체 보기 →</button>${icons(p, "foot")}</div>
  </article>`).join("");

/* sheet */
const sheet = document.getElementById("sheet");
const body = document.getElementById("sheet-body");
let current = -1;

function openSheet(id) {
  const i = ready.findIndex(p => p.id === id);
  if (i < 0) return;
  current = i;
  const p = ready[i];
  let n = 0;
  const secs = SEC.filter(([k]) => p.s[k]).map(([k, label]) => `
    <section class="sec"><h3><span class="n">${++n}</span>${label}</h3><div class="body">${paras(p.s[k])}</div></section>`).join("");
  const pre = p.s.pre ? `<div class="sec"><div class="body">${paras(p.s.pre)}</div></div>` : "";
  const post = p.s.post ? `<div class="sec"><div class="body">${paras(p.s.post)}</div></div>` : "";
  const extra = p.s.extra ? `<section class="sec extra"><h3>지원하며 쓴 글</h3><div class="body">${paras(p.s.extra)}</div></section>` : "";
  const prev = ready[i-1], next = ready[i+1];
  body.innerHTML = `
    <div class="sheet-top">${avatar(p)}<div class="who-text">
      <h2 class="name" id="sheet-name">${esc(p.name)}${p.facil ? '<span class="role-badge">퍼실</span>' : ""}</h2>
      ${sub(p)}${handle(p)}</div></div>
    <p class="work">${esc(p.work)}</p>
    ${p.sns && p.sns.length ? `<div class="accts">${acctBtns(p)}</div>` : ""}
    <p class="line">${lineHTML(p.line)}</p>
    ${pre}${secs}${post}${extra}
    <div class="sheet-nav">
      <button data-open="${prev ? prev.id : ""}" ${prev ? "" : "hidden"}><small>← 이전</small>${prev ? esc(prev.name) : ""}</button>
      <button data-open="${next ? next.id : ""}" ${next ? "" : "hidden"}><small>다음 →</small>${next ? esc(next.name) : ""}</button>
    </div>`;
  if (!sheet.open) sheet.showModal();
  sheet.scrollTop = 0;
  body.scrollTop = 0;
}

document.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const btn = e.target.closest("[data-open]");
  if (btn && btn.dataset.open) { openSheet(btn.dataset.open); return; }
  const c = e.target.closest(".card[data-id]");
  if (c) openSheet(c.dataset.id);
});
document.getElementById("sheet-x").addEventListener("click", () => sheet.close());
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });
document.addEventListener("keydown", e => {

/* 계정 바로가기 */
document.getElementById("links").innerHTML = PEOPLE.map(p => `
  <article class="link-row">
    <div class="who">${avatar(p)}<div class="who-text"><h3 class="name">${esc(p.name)}${p.facil ? '<span class="role-badge">퍼실</span>' : ""}</h3>${sub(p)}</div></div>

  </article>`).join("");

/* tabs */
const VIEWS = ["people", "goals", "links"];
const tabs = Object.fromEntries(VIEWS.map(v => [v, document.getElementById("tab-" + v)]));
function show(view) {
  VIEWS.forEach(v => {
    tabs[v].setAttribute("aria-selected", String(v === view));
    document.getElementById("view-" + v).hidden = v !== view;
  });
}
VIEWS.forEach(v => tabs[v].addEventListener("click", () => { history.replaceState(null, "", "#" + v); show(v); }));
const route = () => { const h = location.hash.slice(1); show(VIEWS.includes(h) ? h : "people"); };
window.addEventListener("hashchange", route);
route();
</script>
